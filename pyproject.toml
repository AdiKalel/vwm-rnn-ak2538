[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vwm-rnn-from-scratch"
version = "0.1.0"
description = "Calibration-first rebuild of a visual working-memory RNN"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
jax = [
  "jax>=0.4",
  "optax>=0.2",
  "orbax-checkpoint>=0.5",
]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
